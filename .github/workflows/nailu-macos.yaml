name: NaiLu macOS builds

on:
  push:
    branches: [main]
    paths: ['.github/workflows/nailu-macos.yaml', 'nailu.patch.gz']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Apply requested client changes in build checkout
        shell: bash
        run: |
          set -euo pipefail
          echo '75ef00607d57636f7e11866be66241585323ef927da3d2ccfcdb6dbec7eb0a0c  nailu.patch.gz' | sha256sum --check
          if ! grep -q 'version: 0.3.0+2026102303' pubspec.yaml; then
            gzip -dc nailu.patch.gz > "$RUNNER_TEMP/nailu.patch"
            git apply --binary --exclude=.github/workflows/nailu.yaml "$RUNNER_TEMP/nailu.patch"
          fi
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: core/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version
      - name: Intel renderer
        if: matrix.arch == 'x64'
        run: plutil -replace FLTEnableImpeller -bool NO macos/Runner/Info.plist
      - name: Install dependencies
        run: flutter pub get
      - name: Test NaiLu account and interface
        shell: bash
        run: |
          cp pubspec.yaml "$RUNNER_TEMP/nailu-pubspec.yaml"
          trap 'cp "$RUNNER_TEMP/nailu-pubspec.yaml" pubspec.yaml' EXIT
          python3 -c "from pathlib import Path; p=Path('pubspec.yaml'); p.write_text(p.read_text().replace('build_assets: true','build_assets: false'))"
          flutter test test/nailu
          node test/nailu/portal_script_test.cjs
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Build macOS
        run: flutter build macos --release --dart-define=APP_ENV=stable
      - name: Package app
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/NaiLu.app dist/NaiLu-0.3.0-macOS-${{ matrix.arch }}-unsigned.zip
          hdiutil create -volname '奈鹿 NaiLu' -srcfolder build/macos/Build/Products/Release/NaiLu.app -ov -format UDZO dist/NaiLu-0.3.0-macOS-${{ matrix.arch }}-unsigned.dmg
          shasum -a 256 dist/* > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NaiLu-macOS-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
      - name: Prepare corresponding source
        if: matrix.arch == 'arm64'
        run: |
          python3 -c 'import pathlib,subprocess,zipfile; a=zipfile.ZipFile("NaiLu-0.3.0-source.zip","w",zipfile.ZIP_DEFLATED); paths=subprocess.check_output(["git","ls-files","-c","-o","--exclude-standard","-z"]).decode().split("\0"); [a.write(p,p) for p in paths if p and pathlib.Path(p).is_file()]; a.close()' 
          git -C core/Clash.Meta archive --format=zip --prefix=core/Clash.Meta/ -o "$RUNNER_TEMP/nailu-core-source.zip" HEAD
          python3 -c 'import os,zipfile; a=zipfile.ZipFile("NaiLu-0.3.0-source.zip","a"); b=zipfile.ZipFile(os.environ["RUNNER_TEMP"]+"/nailu-core-source.zip"); [a.writestr(i,b.read(i.filename)) for i in b.infolist() if not i.is_dir()]; a.close(); b.close()'
      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'arm64'
        with:
          name: NaiLu-source
          path: NaiLu-0.3.0-source.zip
