name: NaiLu client builds

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            arch: all
          - platform: windows
            os: windows-2022
            arch: x64
          - platform: macos
            os: macos-latest
            arch: arm64
          - platform: macos
            os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: matrix.platform == 'android'
      - name: Android native tools
        if: matrix.platform == 'android'
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.2.13676358'
      - uses: NuGet/setup-nuget@v2
        if: matrix.platform == 'windows'
      - name: Flutter dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Android signing
        if: matrix.platform == 'android'
        env:
          KEYSTORE_BASE64: ${{ secrets.NAILU_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nailu-release.jks"
            echo "NAILU_ANDROID_KEYSTORE=$RUNNER_TEMP/nailu-release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build Android APK
        if: matrix.platform == 'android'
        env:
          NAILU_ANDROID_STORE_PASSWORD: ${{ secrets.NAILU_ANDROID_STORE_PASSWORD }}
          NAILU_ANDROID_KEY_PASSWORD: ${{ secrets.NAILU_ANDROID_KEY_PASSWORD }}
          NAILU_ANDROID_KEY_ALIAS: ${{ secrets.NAILU_ANDROID_KEY_ALIAS }}
        run: flutter build apk --release --split-per-abi --dart-define=APP_ENV=stable
      - name: Build Windows portable bundle
        if: matrix.platform == 'windows'
        run: flutter build windows --release --dart-define=APP_ENV=stable
      - name: Build Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $compilerRoot = Join-Path $env:RUNNER_TEMP 'nailu-inno'
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.4.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_4_3/innosetup-6.4.3.exe' -OutFile $installer
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys') { throw 'Compiler signature verification failed' }
          $process = Start-Process $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER', "/DIR=$compilerRoot") -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Compiler installation failed' }
          & tool/build-nailu-installer.ps1 -Iscc (Join-Path $compilerRoot 'ISCC.exe')
      - name: Select macOS Xcode
        if: matrix.platform == 'macos'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version
      - name: Intel macOS renderer
        if: matrix.platform == 'macos' && matrix.arch == 'x64'
        run: plutil -replace FLTEnableImpeller -bool NO macos/Runner/Info.plist
      - name: Build macOS app
        if: matrix.platform == 'macos'
        run: flutter build macos --release --dart-define=APP_ENV=stable
      - name: macOS unsigned distribution archive
        if: matrix.platform == 'macos'
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/NaiLu.app build/NaiLu-macOS-${{ matrix.arch }}-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NaiLu-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/windows/x64/runner/Release/
            build/NaiLu-macOS-*-unsigned.zip
            dist/*-setup.exe
